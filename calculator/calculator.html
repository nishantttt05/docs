<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 24px;
      padding: 24px;
      width: 320px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
    }

    .display {
      background: #0f3460;
      border-radius: 16px;
      padding: 20px 24px 16px;
      margin-bottom: 20px;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
    }

    .display .expression {
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      min-height: 20px;
      word-break: break-all;
      text-align: right;
      margin-bottom: 6px;
    }

    .display .current {
      font-size: 42px;
      font-weight: 300;
      color: #fff;
      word-break: break-all;
      text-align: right;
      line-height: 1;
      transition: font-size 0.1s;
    }

    .display .current.shrink { font-size: 28px; }
    .display .current.shrink-more { font-size: 20px; }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0;
      height: 64px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    button:active { transform: scale(0.93); filter: brightness(0.85); }

    button.btn-func {
      background: #1a4a7a;
      color: #53c0f0;
    }

    button.btn-op {
      background: #e94560;
      color: #fff;
    }

    button.btn-eq {
      background: linear-gradient(135deg, #e94560, #c73652);
      color: #fff;
      grid-row: span 2;
      height: auto;
    }

    button.btn-num {
      background: #1e2a4a;
      color: #fff;
    }

    button.btn-zero {
      grid-column: span 2;
    }

    button.active-op {
      filter: brightness(1.3);
      box-shadow: 0 0 0 2px rgba(233,69,96,0.6);
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="btn-func" data-action="clear">AC</button>
      <button class="btn-func" data-action="sign">+/-</button>
      <button class="btn-func" data-action="percent">%</button>
      <button class="btn-op"   data-action="op" data-op="÷">÷</button>

      <button class="btn-num"  data-digit="7">7</button>
      <button class="btn-num"  data-digit="8">8</button>
      <button class="btn-num"  data-digit="9">9</button>
      <button class="btn-op"   data-action="op" data-op="×">×</button>

      <button class="btn-num"  data-digit="4">4</button>
      <button class="btn-num"  data-digit="5">5</button>
      <button class="btn-num"  data-digit="6">6</button>
      <button class="btn-op"   data-action="op" data-op="−">−</button>

      <button class="btn-num"  data-digit="1">1</button>
      <button class="btn-num"  data-digit="2">2</button>
      <button class="btn-num"  data-digit="3">3</button>
      <button class="btn-op"   data-action="op" data-op="+">+</button>

      <button class="btn-num btn-zero" data-digit="0">0</button>
      <button class="btn-num"  data-action="decimal">.</button>
      <button class="btn-eq"   data-action="equals">=</button>
    </div>
  </div>

  <script>
    const currentEl   = document.getElementById('current');
    const expressionEl = document.getElementById('expression');

    let currentVal  = '0';
    let prevVal     = null;
    let operator    = null;
    let waitingForNext = false;
    let expression  = '';

    function updateDisplay() {
      currentEl.textContent = currentVal;
      expressionEl.textContent = expression;
      const len = currentVal.length;
      currentEl.className = 'current' + (len > 12 ? ' shrink-more' : len > 9 ? ' shrink' : '');
    }

    function highlightOp(op) {
      document.querySelectorAll('.btn-op').forEach(b => b.classList.remove('active-op'));
      if (op) {
        document.querySelectorAll('.btn-op').forEach(b => {
          if (b.dataset.op === op) b.classList.add('active-op');
        });
      }
    }

    function inputDigit(digit) {
      if (waitingForNext) {
        currentVal = String(digit);
        waitingForNext = false;
      } else {
        currentVal = currentVal === '0' ? String(digit) : currentVal + digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (waitingForNext) { currentVal = '0.'; waitingForNext = false; updateDisplay(); return; }
      if (!currentVal.includes('.')) { currentVal += '.'; updateDisplay(); }
    }

    function handleOp(op) {
      const val = parseFloat(currentVal);
      if (prevVal !== null && !waitingForNext) {
        const result = calculate(prevVal, val, operator);
        currentVal = String(parseFloat(result.toFixed(10)));
        prevVal = parseFloat(currentVal);
        expression = currentVal + ' ' + op;
      } else {
        prevVal = val;
        expression = currentVal + ' ' + op;
      }
      operator = op;
      waitingForNext = true;
      highlightOp(op);
      updateDisplay();
    }

    function calculate(a, b, op) {
      switch (op) {
        case '+':  return a + b;
        case '−':  return a - b;
        case '×':  return a * b;
        case '÷':  return b !== 0 ? a / b : 0;
        default:   return b;
      }
    }

    function handleEquals() {
      if (operator === null || prevVal === null) return;
      const val = parseFloat(currentVal);
      const result = calculate(prevVal, val, operator);
      expression = '';
      currentVal = String(parseFloat(result.toFixed(10)));
      prevVal = null;
      operator = null;
      waitingForNext = false;
      highlightOp(null);
      updateDisplay();
    }

    function handleClear() {
      currentVal = '0'; prevVal = null; operator = null;
      waitingForNext = false; expression = '';
      highlightOp(null);
      updateDisplay();
    }

    function handleSign() {
      currentVal = String(parseFloat(currentVal) * -1);
      updateDisplay();
    }

    function handlePercent() {
      currentVal = String(parseFloat(currentVal) / 100);
      updateDisplay();
    }

    // Button clicks
    document.querySelector('.buttons').addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const { action, op, digit } = btn.dataset;
      if (digit !== undefined)       inputDigit(digit);
      else if (action === 'decimal') inputDecimal();
      else if (action === 'op')      handleOp(op);
      else if (action === 'equals')  handleEquals();
      else if (action === 'clear')   handleClear();
      else if (action === 'sign')    handleSign();
      else if (action === 'percent') handlePercent();
    });

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.')            inputDecimal();
      else if (e.key === '+')            handleOp('+');
      else if (e.key === '-')            handleOp('−');
      else if (e.key === '*')            handleOp('×');
      else if (e.key === '/')            { e.preventDefault(); handleOp('÷'); }
      else if (e.key === 'Enter' || e.key === '=') handleEquals();
      else if (e.key === 'Backspace')    {
        if (currentVal.length > 1) { currentVal = currentVal.slice(0, -1); updateDisplay(); }
        else { currentVal = '0'; updateDisplay(); }
      }
      else if (e.key === 'Escape')       handleClear();
      else if (e.key === '%')            handlePercent();
    });

    updateDisplay();
  </script>
</body>
</html>
